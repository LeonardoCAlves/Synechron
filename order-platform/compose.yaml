services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: local-only-bootstrap-password
      POSTGRES_DB: order_platform_bootstrap
      CATALOG_DB_PASSWORD: local-only-catalog-password
      ORDERS_DB_PASSWORD: local-only-orders-password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d order_platform_bootstrap"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:9092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  catalog-service:
    build:
      context: ..
      dockerfile: order-platform/Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      HTTP_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://catalog_user:local-only-catalog-password@postgres:5432/catalog_service?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CATALOG_EVENTS_TOPIC: catalog.product-events.v1
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    build:
      context: ..
      dockerfile: order-platform/Dockerfile
      args:
        SERVICE: order-service
    environment:
      HTTP_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgres://orders_user:local-only-orders-password@postgres:5432/orders_service?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CATALOG_EVENTS_TOPIC: catalog.product-events.v1
      ORDER_EVENTS_TOPIC: order.events.v1
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
