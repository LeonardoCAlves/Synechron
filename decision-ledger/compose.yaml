services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decision_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-decision_ledger_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - decision-ledger-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [mcp]
    environment:
      DATABASE_URL: postgresql://${APP_DATABASE_USER:-decision_ledger_app}:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-decision_ledger}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-decision_ledger_owner}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-decision_ledger}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  decision-ledger-data:
