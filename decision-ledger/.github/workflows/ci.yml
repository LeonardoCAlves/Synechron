name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: decision_ledger
          POSTGRES_USER: decision_ledger_owner
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decision_ledger_owner -d decision_ledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://decision_ledger_owner:ci-only-password@localhost:5432/decision_ledger
      TEST_DATABASE_URL: postgresql://decision_ledger_owner:ci-only-password@localhost:5432/decision_ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run test:integration
      - run: docker build --tag decision-ledger:ci .
