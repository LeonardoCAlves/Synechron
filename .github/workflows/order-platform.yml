name: Order Platform

on:
  pull_request:
    paths:
      - "order-platform/**"
      - ".github/workflows/order-platform.yml"
  push:
    branches: [main]
    paths:
      - "order-platform/**"
      - ".github/workflows/order-platform.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: order-platform/go.mod
          cache-dependency-path: order-platform/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: go build ./...
