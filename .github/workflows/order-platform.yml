name: Order Platform

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "order-platform/**"
      - ".dockerignore"
      - ".github/workflows/order-platform.yml"
  push:
    branches: [main]
    paths:
      - "order-platform/**"
      - ".dockerignore"
      - ".github/workflows/order-platform.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: order-platform
    env:
      ORDER_PLATFORM_CATALOG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
      ORDER_PLATFORM_ORDERS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: order-platform/go.mod
          cache-dependency-path: |
            order-platform/go.mod
            order-platform/go.sum
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -type f -name '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: go build ./...
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config --quiet
      - name: Start local platform
        run: docker compose -f compose.yaml up -d --build --wait
      - name: Run end-to-end smoke test
        run: bash scripts/smoke-test.sh
      - name: Capture Compose logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color
      - name: Stop local platform
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
